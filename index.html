<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion Mirror</title>
<style>
*{box-sizing:border-box}body{margin:0;background:black;color:#c9dbcf;font:14px system-ui,sans-serif}
section{position:relative;height:100svh;display:grid;place-items:center}
canvas{position:absolute;width:100%;height:100%;display:block;transform:scaleX(-1)}
#intro{position:relative}#intro:empty::after{content:"";display:block;width:18px;height:18px;border:1px solid #37443b;border-top-color:#bed2c2;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}
nav{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px}
button{display:grid;place-items:center;width:44px;height:44px;background:#111712;color:#b5c2b7;border:1px solid #344138;border-radius:50%;cursor:pointer}
button[aria-pressed=true]{background:#c6dfbf;color:#162319}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:3px}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
#status:not(.error){position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#status.error{position:fixed;bottom:68px;right:16px;left:16px;text-align:right}
</style><main><section><canvas></canvas><div id="intro" role="status"></div></section>
<nav aria-label="动作控制">
<button id="start" disabled aria-label="开启摄像头" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 10 6-3v10l-6-3"/></svg></button>
<button id="effect" disabled aria-label="开启掌心光带" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-34 12 12)"/><ellipse cx="12" cy="12" rx="5" ry="9" transform="rotate(-34 12 12)"/></svg></button>
</nav><p id="status" role="status"></p></main><script type="module" src="app.js"></script></html>
